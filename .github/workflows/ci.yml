# Проверка каждого push и pull request: detekt и тесты.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Detekt and tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon detekt desktopTest

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: composeApp/build/reports/
